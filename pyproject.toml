[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-cascade"
version = "0.2.0"
description = "A two-tier guardrail cascade with a hash-chained evidence ledger for governed LLM serving"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "flake8>=6.0", "black>=23.0", "mypy>=1.0"]
yaml = ["pyyaml>=6.0"]

[project.scripts]
guardrail-cascade = "guardrail_cascade.cli:main"

[tool.setuptools.packages.find]
include = ["guardrail_cascade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
